[project]
name = "cad-mcp"
version = "0.1.0"
description = "CADCopilot — an MCP server that drives Autodesk Inventor and Fusion 360 with a unified parametric tool set (Adam-CAD style copilot)."
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.27",
    "pywin32>=311",
    "pillow>=11",
    "anthropic>=0.40",
]

[project.scripts]
cad-mcp = "cad_mcp.server:main"
cad-panel = "cad_mcp.panel.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cad_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not flagship'"
markers = [
    "flagship: end-to-end build that launches Inventor; run attended with -m flagship",
]
